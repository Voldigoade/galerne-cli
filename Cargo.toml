[package]
name = "galerne"
version = "0.2.1"
edition = "2021"
authors = ["Voldigoade"]
description = "Ultra-lightweight persistent terminal game designed for developer wait times"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Voldigoade/galerne"
keywords = ["terminal", "game", "cli", "tui", "developer-tools"]
categories = ["command-line-utilities", "games"]
default-run = "galerne"

[dependencies]
crossterm = { version = "0.28", default-features = false, features = ["bracketed-paste", "events", "windows"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.4"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
sha2 = { version = "0.10", default-features = false }
getrandom = { version = "0.2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "galerne"
path = "src/main.rs"

[[bin]]
name = "galerne-setup"
path = "src/bin/setup.rs"

[dev-dependencies]

[[bench]]
name = "engine_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
