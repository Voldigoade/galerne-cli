name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Clippy Linter (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Test Suite
        run: cargo test --all-targets --all-features

      - name: Build Release Binary
        run: cargo build --release

      - name: Verify Binary Size Budget (< 5 MiB)
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            BIN_PATH="target/release/galerne"
          else
            BIN_PATH="target/release/galerne.exe"
          fi
          SIZE_BYTES=$(wc -c < "$BIN_PATH")
          echo "Release binary size: $SIZE_BYTES bytes"
          # Budget is 5,242,880 bytes (5 MiB)
          if [ "$SIZE_BYTES" -gt 5242880 ]; then
            echo "Error: Release binary exceeded 5 MiB budget!"
            exit 1
          fi
          echo "Binary size within performance budget."
