name: Release Build & Distribution

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: galerne-x86_64-unknown-linux-gnu.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: galerne-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Optimized Release Binary
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} --bin galerne
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            export EMBED_GALERNE_BIN="target/${{ matrix.target }}/release/galerne.exe"
            cargo build --release --target ${{ matrix.target }} --bin galerne-setup
            cp target/${{ matrix.target }}/release/galerne-setup.exe Galerne-Setup-x86_64.exe
            sha256sum Galerne-Setup-x86_64.exe > Galerne-Setup-x86_64.exe.sha256
          fi

      - name: Package Linux Archive
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/galerne package/
          cp README.md LICENSE package/
          tar -czf ${{ matrix.artifact_name }} -C package .
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
          cp target/${{ matrix.target }}/release/galerne galerne-x86_64-unknown-linux-gnu
          sha256sum galerne-x86_64-unknown-linux-gnu > galerne-x86_64-unknown-linux-gnu.sha256

      - name: Package Windows Archive
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/galerne.exe package/
          cp README.md LICENSE package/
          7z a ${{ matrix.artifact_name }} ./package/*
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256
            Galerne-Setup-x86_64.exe*
            galerne-x86_64-unknown-linux-gnu*

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
